<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Weather App</title>

   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"rel="stylesheet"/>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="container py-5">
      <div class="weather-card shadow-lg rounded-4 p-4 mx-auto">
        <h1 class="text-center text-primary fw-bold mb-4">
          <i class="bi bi-cloud-sun"></i>
          Weather App
        </h1>

        <div class="search-section input-group mb-4">
          <input
            type="text"
            id="cityInput"
            class="form-control form-control-lg"
            placeholder="Enter City Name"
          />

          <button
            onclick=""
            class="btn btn-primary px-4"
          >
            Search
          </button>
        </div>
      </div>
    </div>

    <div id="loading" class="hidden text-center text-primary fw-bold">
      Loading...
    </div>

    <div id="weatherInfo" class="weather-info shadow rounded-4 p-4 mx-auto">
      <h2 id="cityName" class="text-center text-primary fw-bold"></h2>

      <p id="temperature" class="temperature text-center"></p>

      <p id="weatherCondition" class="text-center fs-4"></p>

      <p id="humidity" class="weather-detail">
        <i class="bi bi-droplet-fill text-primary"></i>
      </p>

      <p id="windSpeed" class="weather-detail">
        <i class="bi bi-wind text-info"></i>
      </p>

      <div id="error" class="hidden alert alert-danger text-center">
        City Not Found. Please Try again
      </div>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
